<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Saffron / Orange Gradient for Left Lion -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f97316" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#c2410c" />
    </linearGradient>

    <!-- White / Silver Gradient for Center Lion -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#f8fafc" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>

    <!-- India Green Gradient for Right Lion -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22c55e" />
      <stop offset="50%" stopColor="#16a34a" />
      <stop offset="100%" stopColor="#15803d" />
    </linearGradient>

    <!-- Golden Brown Gradient for Abacus Base -->
    <linearGradient id="goldAbacus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
  </defs>

  <g stroke="#0f172a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- ================= LEFT LION (SAFFRON) ================= -->
    <g fill="url(#saffronGrad)">
      <!-- Left Lion Head Profile -->
      <path d="M165,100 C140,95 115,110 100,130 C85,155 80,185 90,210 C100,235 120,260 145,275 C165,290 185,300 200,305 C185,275 175,245 170,215 C160,175 160,135 165,100 Z" />
      <!-- Left Foreleg -->
      <path d="M185,305 C180,335 175,370 170,410 L205,410 C210,370 215,335 220,305 Z" />
      <!-- Mane tufts -->
      <path d="M130,170 Q145,185 160,175" fill="none" stroke="#7c2d12" stroke-width="2.5" />
      <path d="M120,210 Q135,225 150,215" fill="none" stroke="#7c2d12" stroke-width="2.5" />
      <path d="M135,250 Q150,265 165,255" fill="none" stroke="#7c2d12" stroke-width="2.5" />
    </g>
    <!-- Left Eye & Snout -->
    <circle cx="120" cy="150" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="120" cy="150" r="3.5" fill="#0f172a" />
    <path d="M100,170 Q115,185 130,175" fill="none" stroke="#0f172a" stroke-width="3" />

    <!-- ================= RIGHT LION (GREEN) ================= -->
    <g fill="url(#greenGrad)">
      <!-- Right Lion Head Profile -->
      <path d="M335,100 C360,95 385,110 400,130 C415,155 420,185 410,210 C400,235 380,260 355,275 C335,290 315,300 300,305 C315,275 325,245 330,215 C340,175 340,135 335,100 Z" />
      <!-- Right Foreleg -->
      <path d="M315,305 C320,335 325,370 330,410 L295,410 C290,370 285,335 280,305 Z" />
      <!-- Mane tufts -->
      <path d="M370,170 Q355,185 340,175" fill="none" stroke="#14532d" stroke-width="2.5" />
      <path d="M380,210 Q365,225 350,215" fill="none" stroke="#14532d" stroke-width="2.5" />
      <path d="M365,250 Q350,265 335,255" fill="none" stroke="#14532d" stroke-width="2.5" />
    </g>
    <!-- Right Eye & Snout -->
    <circle cx="380" cy="150" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="380" cy="150" r="3.5" fill="#0f172a" />
    <path d="M400,170 Q385,185 370,175" fill="none" stroke="#0f172a" stroke-width="3" />

    <!-- ================= CENTER LION (WHITE / SILVER) ================= -->
    <g fill="url(#whiteGrad)">
      <!-- Main Center Head -->
      <path d="M250,20 C220,20 200,40 190,65 C175,60 160,70 155,85 C150,100 155,120 160,130 C150,140 145,160 150,175 C155,200 170,220 190,235 C210,250 230,265 250,280 C270,265 290,250 310,235 C330,220 345,200 350,175 C355,160 350,140 340,130 C345,120 350,100 345,85 C340,70 325,60 310,65 C300,40 280,20 250,20 Z" />
      
      <!-- Mane & Chest Fur Pattern -->
      <path d="M190,230 Q250,270 310,230 L300,330 Q250,365 200,330 Z" />
      
      <!-- Front Legs (Center) -->
      <path d="M190,320 L180,410 L220,410 L225,325 Z M310,320 L320,410 L280,410 L275,325 Z" />
    </g>

    <!-- Center Facial Features -->
    <ellipse cx="220" cy="100" rx="9" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="220" cy="100" r="4" fill="#0f172a" />
    <ellipse cx="280" cy="100" rx="9" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="280" cy="100" r="4" fill="#0f172a" />
    
    <!-- Nose & Mouth details -->
    <path d="M235,120 C240,135 260,135 265,120 C270,145 230,145 235,120 Z" fill="#0f172a" />
    <path d="M215,145 Q250,170 285,145" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <path d="M230,152 L270,152" fill="none" stroke="#0f172a" stroke-width="2.5" />

    <!-- Detailed Chest Mane Textures -->
    <g stroke="#64748b" stroke-width="2.5" fill="none">
      <path d="M220,245 Q250,265 280,245" />
      <path d="M210,270 Q250,290 290,270" />
      <path d="M215,295 Q250,315 285,295" />
      <path d="M225,320 Q250,340 275,320" />
    </g>

    <!-- ================= ABACUS BASE PLATFORM ================= -->
    <rect x="70" y="410" width="360" height="75" rx="12" fill="url(#goldAbacus)" />
    <path d="M90,485 Q250,505 410,485 L395,510 Q250,525 105,510 Z" fill="#92400e" />

    <!-- Left Bull / Galloping Horse on Base -->
    <g fill="#0f172a" stroke="none">
      <path d="M120,445 C125,430 145,430 155,445 C160,455 170,450 175,465 L145,470 C135,460 120,465 120,445 Z" />
      <!-- Right Bull on Base -->
      <path d="M330,465 C335,450 345,455 350,445 C360,430 380,430 385,445 C385,465 370,460 360,470 Z" />
    </g>

    <!-- ================= ASHOKA CHAKRA (NAVY BLUE WHEEL) ================= -->
    <circle cx="250" cy="447" r="32" fill="#ffffff" stroke="#1e3a8a" stroke-width="4.5" />
    <circle cx="250" cy="447" r="7" fill="#1e3a8a" stroke="none" />
    <!-- 24 Spokes -->
    <g stroke="#1e3a8a" stroke-width="2.5">
      <line x1="250" y1="416" x2="250" y2="478" />
      <line x1="219" y1="447" x2="281" y2="447" />
      <line x1="228" y1="425" x2="272" y2="469" />
      <line x1="228" y1="469" x2="272" y2="425" />
      <line x1="236" y1="419" x2="264" y2="475" />
      <line x1="264" y1="419" x2="236" y2="475" />
      <line x1="222" y1="433" x2="278" y2="461" />
      <line x1="222" y1="461" x2="278" y2="433" />
    </g>

  </g>

  <!-- ================= MOTTO: "सत्यमेव जयते" ================= -->
  <text 
    x="250" 
    y="550" 
    text-anchor="middle" 
    font-size="34" 
    font-weight="900" 
    font-family="'Cormorant Garamond', 'Noto Sans Devanagari', 'Mangal', 'Arial', sans-serif" 
    fill="#0f172a" 
    letter-spacing="2"
  >
    सत्यमेव जयते
  </text>
</svg>
